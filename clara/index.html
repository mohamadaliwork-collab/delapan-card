  .card::after{content:"";position:absolute;inset:10px;border:1px solid var(--gold-line);border-radius:15px;pointer-events:none}
  .front{padding:46px 30px 32px;text-align:center;position:relative;z-index:1}
  .mark{width:58px;height:auto;display:block;margin:0 auto 26px;opacity:.95}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:40px;line-height:1.05;letter-spacing:.02em;color:var(--paper)}
  .role{margin-top:12px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:400;line-height:1.7}
  .rule{width:42px;height:1px;background:var(--gold-soft);margin:24px auto}
  .company{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--paper);opacity:.75;font-weight:300}
  .wordmark{width:62%;max-width:230px;height:auto;display:block;margin:0 auto}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:999px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;font-weight:500;
    transition:transform .15s ease,background .2s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn svg{width:16px;height:16px}
  .solid{background:var(--gold);color:#1e0505}
  .ghost{border:1px solid var(--gold-soft);color:var(--gold);background:rgba(0,0,0,.15)}
  .contact{padding:8px 24px;position:relative;z-index:1}
  .row{display:flex;align-items:center;gap:14px;padding:16px 6px;border-top:1px solid var(--gold-line)}
  .row:first-child{border-top:0}
  .ico{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold)}
  .ico svg{width:15px;height:15px}
  .txt{flex:1;min-width:0}
  .lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.85}
  .val{font-size:13.5px;margin-top:3px;color:var(--paper);overflow-wrap:anywhere;text-decoration:none;display:block;font-weight:300}
  .copy{flex:0 0 auto;background:none;border:1px solid var(--gold-line);color:var(--gold);font:500 9px "Montserrat",sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:8px 11px;border-radius:999px;cursor:pointer}
  .copy.done{background:var(--gold);color:#1e0505}
  .back{padding:36px 30px 32px;text-align:center;position:relative;z-index:1}
  .qrbox{background:var(--paper);width:170px;height:170px;margin:0 auto;border-radius:14px;display:grid;place-items:center;padding:12px}
  .qrbox img,.qrbox svg{width:100%;height:100%;display:block}
  .scan{margin-top:16px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .handle{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;margin-top:6px;color:var(--paper)}
  .save{width:100%;height:50px;border:0;cursor:pointer;margin-top:24px}
  .wordmark.backlogo{margin:34px auto 6px;width:54%}
  .foot{text-align:center;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(178,159,130,.5);margin-top:2px}
</style>
</head>
